<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020a04">
  <meta name="description" content="Cámara en tiempo real convertida a arte ASCII, con paletas estilo Matrix. Toma fotos y compártelas.">
  <title>ASCII Cam</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23020a04'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='700' text-anchor='middle' fill='%2300ff41'%3E@%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <canvas id="screen" role="img" aria-label="Vista de la cámara convertida a ASCII"></canvas>
  <video id="video" playsinline muted aria-hidden="true"></video>
  <div class="crt" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand" aria-label="ASCII Cam">ASCII<span>//</span>CAM</div>
    <div class="status" id="status" data-state="idle">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text">SIN SEÑAL</span>
    </div>
  </header>

  <section class="gate" id="gate" aria-labelledby="gate-title">
    <p class="kicker" id="gate-kicker">CH 00 · SIN SEÑAL</p>
    <h1 id="gate-title">Mírate en código.</h1>
    <p id="gate-msg">Activa la cámara para convertir lo que ves en ASCII en tiempo real. Nada sale de tu dispositivo.</p>
    <button type="button" class="btn primary" id="enable">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Activar cámara
    </button>
  </section>

  <nav class="dock" aria-label="Controles">
    <button type="button" class="icon-btn" popovertarget="settings" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    </button>
    <button type="button" class="shutter" id="shutter" aria-label="Tomar foto (barra espaciadora)">
      <span aria-hidden="true"></span>
    </button>
    <button type="button" class="icon-btn" id="flip" aria-label="Cambiar cámara" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.6-4.5M4 4v3h3M4 13a8 8 0 0 0 14.6 4.5M20 20v-3h-3"/></svg>
    </button>
  </nav>

  <dialog id="settings" popover aria-labelledby="settings-title" class="panel">
    <div class="panel-head">
      <h2 id="settings-title">Ajustes</h2>
      <button type="button" class="icon-btn small" popovertarget="settings" popovertargetaction="hide" aria-label="Cerrar ajustes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <fieldset>
      <legend>Paleta</legend>
      <div class="swatches" id="swatches"></div>
      <div class="pickers">
        <label>Fondo <input type="color" id="bg-color"></label>
        <label>Caracteres <input type="color" id="fg-color"></label>
      </div>
    </fieldset>

    <label class="field">Caracteres
      <select id="charset">
        <option value="matrix">Matrix (katakana)</option>
        <option value="clasico">Clásico</option>
        <option value="detallado">Detallado</option>
        <option value="bloques">Bloques</option>
        <option value="binario">Binario</option>
      </select>
    </label>

    <label class="field">Densidad <output id="density-out"></output>
      <input type="range" id="density" min="40" max="220" step="4">
    </label>

    <label class="field">Contraste <output id="contrast-out"></output>
      <input type="range" id="contrast" min="0.5" max="2.5" step="0.1">
    </label>

    <div class="toggles">
      <label class="toggle"><input type="checkbox" id="rain" switch> Lluvia digital</label>
      <label class="toggle"><input type="checkbox" id="crt" switch> Efecto CRT</label>
      <label class="toggle"><input type="checkbox" id="invert" switch> Invertir</label>
      <label class="toggle"><input type="checkbox" id="mirror" switch> Espejo</label>
    </div>
  </dialog>

  <dialog id="photo" closedby="any" aria-labelledby="photo-title" class="panel photo">
    <div class="panel-head">
      <h2 id="photo-title">Captura</h2>
      <form method="dialog">
        <button class="icon-btn small" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </form>
    </div>
    <img id="photo-img" alt="Foto capturada en arte ASCII">
    <div class="actions">
      <button type="button" class="btn primary" id="share" autofocus>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
        Compartir
      </button>
      <button type="button" class="btn" id="download">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
        Descargar
      </button>
      <button type="button" class="btn" id="copy-text">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
        Copiar texto
      </button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
